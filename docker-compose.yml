# Local infrastructure: PostgreSQL 16 and Redis 7.
#   docker compose up -d            # just the databases
#   docker compose --profile api up # databases + the API container
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
      POSTGRES_DB: hotel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    profiles: ["api"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hotel_app:hotel_app@postgres:5432/hotel
      DATABASE_PLATFORM_URL: postgresql://hotel_platform:hotel_platform@postgres:5432/hotel
      DATABASE_MIGRATION_URL: postgresql://hotel:hotel@postgres:5432/hotel
      REDIS_URL: redis://redis:6379
    # Apply migrations, then start the API.
    command: ["sh", "-c", "pnpm exec prisma migrate deploy && node dist/main.js"]
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
